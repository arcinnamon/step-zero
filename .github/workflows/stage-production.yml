name: "Stage: production"
run-name: "production #${{ inputs.issue }}"

# Normally started by the orchestrator after you reply APPROVED on staging.
# You can also run it by hand with no issue to redeploy the default branch.
on:
  workflow_dispatch:
    inputs:
      issue: { description: "Issue number (blank = redeploy default branch)", required: false, type: string, default: "" }
      feedback_comment_id: { description: Unused, required: false, type: string, default: "" }

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  ISSUE: ${{ inputs.issue }}
  APPROVER: ${{ vars.PIPELINE_APPROVER || github.repository_owner }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  merge:
    if: ${{ inputs.issue != '' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: merge
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/pipeline.js').mergeForProduction({ github, context, core });

  deploy:
    needs: merge
    if: ${{ always() && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add yourself as a required reviewer on this environment (see README).
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url }}
    outputs:
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.merge.outputs.sha || env.DEFAULT_BRANCH }}
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Runs before the new code ships, so migrations must be backward-compatible.
      - name: Migrate production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then echo "Supabase not set up; skipping."; exit 0; fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Deploy to production
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Optional: your APPROVED comment also approves the environment gate, so you
  # only act once. Needs the APPROVER_PAT secret; without it, tap Approve in
  # the GitHub app when it asks.
  #
  # Security tradeoff: the required-reviewer gate is meant to be a second,
  # independent check (a live GitHub session) before code reaches production.
  # Setting APPROVER_PAT collapses that into your issue comment alone. Only
  # set this secret if a single APPROVED comment is an acceptable bar for
  # shipping to production; otherwise leave it unset.
  auto-approve:
    needs: merge
    if: ${{ needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.APPROVER_PAT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then echo "No APPROVER_PAT; approve in the GitHub app."; exit 0; fi
          for i in $(seq 1 36); do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments" \
              --jq 'map(select(.environment.name == "production" and .current_user_can_approve)) | first | .environment.id // empty')
            if [ -n "$id" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pending_deployments" \
                -F "environment_ids[]=$id" -f state=approved -f comment="Approved by APPROVED on issue #${ISSUE}"
              echo "Approved."; exit 0
            fi
            sleep 5
          done
          echo "No pending approval found (environment may have no reviewers)."

  report:
    needs: [merge, deploy]
    if: ${{ always() && inputs.issue != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          URL: ${{ needs.deploy.outputs.url }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const P = require('./.github/scripts/pipeline.js');
            if (process.env.DEPLOY_RESULT === 'success') await P.finishProduction({ github, context });
            else if (process.env.DEPLOY_RESULT !== 'cancelled') await P.failStage({ github, context, stage: 'production' });
