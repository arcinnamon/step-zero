schema_version: 1
architecture:
  architecture_id: demo-notes
  revision_id: demo-notes-r1
  content_digest: null
tasks:
  - id: add-note-api
    title: Add the notes API route
    architecture_binding: { architecture_id: demo-notes, revision_id: demo-notes-r1 }
    requirement_ids: [REQ-001, REQ-002]
    depends_on: []
    scope:
      summary: Implement POST /api/notes with a size cap.
      allowed_paths: ["src/api/notes/**", "tests/api/notes/**"]
    acceptance_criteria:
      - POST /api/notes stores a note and returns 201.
      - Notes over the size cap are rejected with 400.
    commands:
      - { id: unit-tests, run: npm test, timeout_seconds: 600 }
    retries: { max_attempts: 3 }
    evidence: { required: [ci-results, scope-check, pr-binding] }
  - id: add-notes-list
    title: Render the notes list
    architecture_binding: { architecture_id: demo-notes, revision_id: demo-notes-r1 }
    requirement_ids: [REQ-001]
    depends_on: [add-note-api]
    scope:
      summary: List stored notes on the home page.
      allowed_paths: ["src/components/notes/**"]
    acceptance_criteria:
      - The home page lists notes newest first.
    commands:
      - { id: unit-tests, run: npm test, timeout_seconds: 600 }
    retries: { max_attempts: 2 }
    evidence: { required: [ci-results, scope-check, pr-binding] }
